[project]
name = "feista-media"
version = "0.1.0"
description = "Feista media worker: Story Studio assembly + media QA (FFmpeg)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
feista-media = "feista_media.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feista_media"]

[tool.ruff]
line-length = 120

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["faster_whisper"]
ignore_missing_imports = true
